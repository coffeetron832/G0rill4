<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Política de contenido: solo se permiten los orígenes que usa la página.
       Si FFmpeg falla con un error de WebAssembly, añade 'wasm-unsafe-eval' a script-src. -->
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' 'wasm-unsafe-eval' 'sha256-lfZHEt1P8LPhZtSI4cfST6XSLmd8fy65mn7FvYpMrh8=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com;
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
             font-src 'self' https://fonts.gstatic.com;
             img-src 'self' blob: data:;
             media-src 'self' blob:;
             connect-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com;
             worker-src 'self' blob:;
             object-src 'none';
             base-uri 'self';
             form-action 'none';">

  <!-- SEO Básico -->
  <title>Gorilla File Compressor - Let the gorilla crush your files!</title>
  <meta name="description" content="Compress your files privately, fast and free, right in your browser with Gorilla File Compressor.">
  <meta name="keywords" content="file compressor, free online compressor">
  <meta name="author" content="jahp">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gorilla File Compressor">
  <meta property="og:description" content="Let the gorilla crush your files! Fast compression for images, PDFs and much more.">
  <meta property="og:site_name" content="Gorilla">

  <!-- Favicon Emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦍</text></svg>">

  <!-- Tema: se aplica antes de pintar la página para evitar un destello claro.
       Permitido en la CSP solo por su hash (sha256-lfZHEt1P8LPhZtSI4cfST6XSLmd8fy65mn7FvYpMrh8=). -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gorilla-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <!-- Google Fonts: Finger Paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">

  <!-- Hoja de Estilos -->
  <link rel="stylesheet" href="banana.css">

  <!-- Librerías de procesamiento (SRI: el navegador verifica el hash de cada archivo) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
    integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"
    integrity="sha384-6/bC5JALX+1f4qWEISHzy0RxgaQJaIgPNfbwFYhc0oV6v9+dqHeExb3NKyQ865Vm" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"
    integrity="sha384-rNlaE5fs9dGIjmxWDALQh/RBAaGRYT5ChrzHo6tRfgrZ36iRFAiquP5g41Jsv+0j" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/upng-js/2.1.0/UPNG.min.js"
    integrity="sha384-ZL3zm2yr6WhKklr+limPN2KaWCW0x8rd9QIg3jabcFyrF6wB/h7VgythzrDTAI2O" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
    integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"
    integrity="sha384-xuasJXVcyv3hZq0eYpelEkBC8l4yufatZXDsKuyCU2rqfhDCb+ftuE/mSfZAteiK" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"
    integrity="sha384-m5or9sW5FUT2WQbj3UthGceVpwo9zSgHKdCugYKHl19lyXPvwO/oQcmq8Fw0FfaA" crossorigin="anonymous"></script>

  <!-- Iconos Lucide -->
  <script defer src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"
    integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous"></script>
</head>
<body>

  <noscript>
    <p>Please enable JavaScript to use Gorilla File Compressor.</p>
  </noscript>

  <!-- Enlace para saltar directamente al contenido (visible solo al enfocarlo con teclado) -->
  <a class="skip-link" id="skipLink" href="#workspace">Skip to main content</a>

  <!-- Controles superiores: tema e idioma -->
  <div class="lang-selector-container">
    <button id="themeToggle" class="theme-toggle" type="button"
      aria-label="Switch to dark mode"
      data-tooltip="Switch to dark mode" data-tooltip-pos="bottom">
      <span class="theme-icon icon-moon" aria-hidden="true"><i data-lucide="moon"></i></span>
      <span class="theme-icon icon-sun" aria-hidden="true"><i data-lucide="sun"></i></span>
    </button>

    <label class="sr-only" id="langLabel" for="langSelect">Language</label>
    <select id="langSelect" class="lang-select">
      <option value="en" selected>English</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="vi">Tiếng Việt</option>
    </select>
  </div>

  <div class="container">
    <main class="app" id="workspace" tabindex="-1">

      <header class="hero">
        <h1>
          <span class="h1-top">Gorilla</span>
          <span class="h1-bottom">File Compressor</span>
        </h1>
        <p class="hero-text" id="heroText" data-i18n="heroText">Compress your files 100% free</p>
      </header>

      <!-- Pestañas: la lista es un tablist; el botón + queda fuera de la lista -->
      <div class="tabs-bar">
        <div class="tab-list" id="tabList" role="tablist" aria-label="Open files"></div>
        <button class="btn-add-tab" id="addTabBtn" type="button"
          aria-label="New tab" data-tooltip="New tab">+</button>
      </div>

      <!-- Aquí se insertan las pestañas clonando la plantilla -->
      <div id="tabContentsContainer"></div>

      <div class="hero-formats">
        <p id="formatsLabel">Supported formats:</p>
        <ul class="formats-grid" id="formatsList"></ul>
        <p class="formats-max" id="formatsMax"></p>
      </div>

    </main>
  </div>

  <!-- Plantilla de una pestaña -->
  <template id="tabTemplate">
    <div class="tab-panel" role="tabpanel">

      <div class="drop-zone" data-state="idle" tabindex="-1">
        <input type="file" class="file-input" hidden
          accept=".jpg,.jpeg,.png,.webp,.pdf,.mp3,.wav,.mp4,.webm,.svg,.json,.csv,.txt">

        <!-- Estado 1: Esperando archivo -->
        <div class="drop-state state-idle">
          <span class="drop-icon" aria-hidden="true"><i data-lucide="folder-open"></i></span>
          <div class="idle-gorilla" aria-hidden="true">🦍</div>
          <p class="drop-title"></p>
          <p class="drop-subtitle"></p>

          <!-- Selector de nivel de compresión (radio group accesible) -->
          <div class="level-group" role="radiogroup">
            <button type="button" class="level-btn" role="radio" data-level="light" aria-checked="false"></button>
            <button type="button" class="level-btn" role="radio" data-level="balanced" aria-checked="false"></button>
            <button type="button" class="level-btn" role="radio" data-level="strong" aria-checked="false"></button>
          </div>

          <div class="drop-actions">
            <button class="btn-outline choose-btn" type="button"></button>
            <button class="btn-primary compress-btn" type="button" disabled></button>
          </div>
        </div>

        <!-- Mensajes en línea: el lector de pantalla los anuncia -->
        <p class="error-text" role="alert"></p>

        <!-- Estado 2: Procesando y gorila (se mantiene visible al terminar) -->
        <div class="drop-state state-processing" hidden>
          <div class="crush-stage" aria-hidden="true">
            <div class="gorilla">🦍</div>
            <div class="file-preview-container"></div>
          </div>
          <p class="processing-text" role="status"></p>

          <!-- Barra de progreso: solo aparece en video y audio -->
          <div class="progress" hidden>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill"></div>
            </div>
            <span class="progress-value" aria-hidden="true"></span>
          </div>
        </div>
      </div>

      <!-- Estado 3: Diálogo de resultado (se mueve a <body> al crearse la pestaña) -->
      <div class="result-modal" hidden>
        <div class="result-card" role="dialog" aria-modal="true">
          <button class="result-close" type="button">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>

          <!-- Anillo de porcentaje: el valor se escribe desde silverblack.js -->
          <div class="result-ring" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <circle class="ring-track" cx="60" cy="60" r="52"></circle>
              <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
            </svg>
            <span class="ring-value">0%</span>
          </div>

          <h2 class="success-text"></h2>
          <p class="savings-text"></p>
          <a class="btn-primary download-btn" href="#" download></a>
          <button class="btn-link reset-btn" type="button"></button>

          <!-- Compartir: solo enlaces oficiales de cada red y copiar enlace.
               Si el navegador tiene Web Share API, silverblack.js muestra el botón nativo
               y oculta los enlaces. -->
          <div class="share-block">
            <p class="share-label"></p>
            <button type="button" class="share-native" hidden></button>
            <div class="share-links">
              <a class="share-btn share-whatsapp" href="#" target="_blank" rel="noopener noreferrer" data-share="whatsapp"
                 aria-label="WhatsApp"><i data-lucide="message-circle" aria-hidden="true"></i></a>
              <a class="share-btn share-x" href="#" target="_blank" rel="noopener noreferrer" data-share="x"
                 aria-label="X"><i data-lucide="twitter" aria-hidden="true"></i></a>
              <a class="share-btn share-facebook" href="#" target="_blank" rel="noopener noreferrer" data-share="facebook"
                 aria-label="Facebook"><i data-lucide="facebook" aria-hidden="true"></i></a>
              <a class="share-btn share-linkedin" href="#" target="_blank" rel="noopener noreferrer" data-share="linkedin"
                 aria-label="LinkedIn"><i data-lucide="linkedin" aria-hidden="true"></i></a>
              <button type="button" class="share-btn share-copy" data-share="copy" aria-label=""><i data-lucide="link" aria-hidden="true"></i></button>
            </div>
            <p class="share-feedback" role="status"></p>
          </div>
        </div>
      </div>

    </div>
  </template>

  <!-- Footer Sticky Horizontal -->
  <footer class="sticky-footer">
    <a href="https://github.com/coffeetron832/G0rill4" target="_blank" rel="noopener noreferrer" class="footer-link">G0rill4<span class="sr-only" id="newTabNote">(opens in a new tab)</span></a>
    <span class="dot-separator">|</span>
    <span>v1.4.1</span>
    <span class="dot-separator">|</span>
    <span>&copy; 2026 jahp.</span>
    <span class="dot-separator">|</span>
    <span data-i18n="rights">All rights reserved.</span>
    <span class="dot-separator">|</span>
    <!-- Tooltip hacia arriba (posición por defecto): el footer está pegado abajo -->
    <span class="privacy-note tooltip-wide" tabindex="0" role="note"
      data-i18n-tooltip="privacyNote"
      data-tooltip="Your files are processed in your own browser and are never uploaded to a server. The page only downloads the compression tools from public servers."><span data-i18n="privacyLabel">Privacy</span></span>
  </footer>

  <canvas id="physicsCanvas"></canvas>

  <!-- Scripts propios: se ejecutan en orden, después de que cargan las librerías (defer) -->
  <script defer src="uhoh-ah-ah.js"></script>
  <!-- Motor: helpers, sonidos y plátano -->
  <script defer src="kong-engine.js"></script>
  <!-- Textos, helpers y compresión por tipo de archivo -->
  <script defer src="compression.js"></script>
  <!-- Lógica de pestañas e interfaz -->
  <script defer src="silverblack.js"></script>
  <!-- Modo claro / oscuro -->
  <script defer src="theme.js"></script>
</body>
</html>
